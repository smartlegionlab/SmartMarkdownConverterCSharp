name: Release Binaries

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build (windows-x64)
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Publish
        run: dotnet publish SmartPasswordManagerCsharpDesktop/SmartPasswordManagerCsharpDesktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish

      - name: Rename binary
        shell: bash
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          cp publish/SmartPasswordManagerCsharpDesktop.exe \
             "smart-password-manager-windows-x64-${VERSION}.exe"

      - name: Upload binary to release
        uses: softprops/action-gh-release@v2
        with:
          files: smart-password-manager-windows-x64-${{ github.event.release.tag_name }}.exe